<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>User Details</title>
</head>
<body>
    <div class="container text-center">
        <br><br><br>
        <h1>Hello!</h1>
        <br/>
        <hr />
        <p>Welcome to the Homepage... </p>
        <div class="row">
            <div class="col-12 d-flex justify-content-center w-100">
                <form th:action="@{/api/sendUser}" th:object="${user}" method="GET">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" class="form-control"
                               th:field="*{fName}" placeholder="First Name">
                    </div>
                    <br>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" class="form-control"
                               th:field="*{lName}" placeholder="Last Name">
                    </div>
                    <br>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" class="form-control"
                               th:field="*{city}" placeholder="City">
                    </div>
                    <br>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="text" class="form-control"
                               th:field="*{age}" placeholder="Age">
                    </div>
                    <br>
                    &nbsp <input type="submit" class="btn btn-outline-primary" value="Send" />
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
